<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Panel | Tea Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <style>
      body { background: var(--bg); }
      .admin-wrap { padding: 32px 0 48px; }

      .admin-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }
      .admin-header h1 {
        font-size: 1.8rem;
        margin: 0;
        position: relative;
        padding-bottom: 6px;
      }
      .admin-header h1::after {
        content: "";
        display: block;
        height: 4px;
        width: 80px;
        margin-top: 8px;
        border-radius: 4px;
        background: var(--accent);
      }

      .admin-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .status-badge.online { background: rgba(43,138,74,0.15); color: var(--accent); }
      .status-badge.offline { background: rgba(220,38,38,0.15); color: #dc2626; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .online .status-dot { background: var(--accent); animation: pulse 2s infinite; }
      .offline .status-dot { background: #dc2626; }

      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

      .tabs {
        display: flex;
        gap: 0;
        margin: 24px 0 20px;
        border-bottom: 2px solid rgba(0,0,0,0.06);
      }
      .tab-btn {
        padding: 12px 16px;
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        font-weight: 600;
        color: var(--muted);
        transition: all 0.2s ease;
      }
      .tab-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab-btn:hover {
        color: var(--text);
      }

      .tab-content { display: none; }
      .tab-content.active { display: block; }

      /* Search / filter */
      .search-bar {
        padding: 8px 14px;
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
        width: 220px;
        background: var(--panel);
        color: var(--text);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .search-bar:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(43,138,74,0.12);
      }

      /* Table */
      .table-wrap {
        overflow-x: auto;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        border: 1px solid rgba(0,0,0,0.04);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      th {
        padding: 12px 14px;
        text-align: left;
        font-weight: 700;
        color: var(--muted);
        background: rgba(0,0,0,0.02);
        border-bottom: 2px solid rgba(0,0,0,0.06);
        white-space: nowrap;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(0,0,0,0.04);
        vertical-align: top;
      }
      tbody tr {
        transition: background 0.12s ease;
      }
      tbody tr:nth-child(odd) { background: rgba(0,0,0,0.015); }
      tbody tr:hover { background: rgba(43,138,74,0.08); }

      .state-msg {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 1rem;
      }
      .state-msg.error {
        color: #dc2626;
      }
      .state-icon {
        display: block;
        font-size: 2.4rem;
        margin-bottom: 12px;
      }

      .console-panel {
        background: #1e1e1e;
        color: #00ff00;
        padding: 16px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        font-size: 0.85rem;
        max-height: 200px;
        overflow-y: auto;
        margin-top: 16px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .console-panel .log { display: block; margin-bottom: 4px; }
      .console-panel .error { color: #ff6b6b; }
      .console-panel .success { color: #51cf66; }

      .info-card {
        background: var(--panel);
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        border-left: 4px solid var(--accent);
      }

      small { color: var(--muted); display: block; margin-top: 4px; }

      .contact-count {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: rgba(43,138,74,0.04);
        border-radius: 20px;
        font-size: 0.85rem;
        color: var(--accent);
        font-weight: 600;
      }

      @media (max-width: 640px) {
        .admin-header { flex-direction: column; align-items: flex-start; }
        .search-bar { width: 100%; }
        table th, table td { padding: 10px 10px; font-size: 0.88rem; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:16px">
        <a href="index.html" class="brand" aria-label="Tea Shop home">🍵 Tea Shop</a>
        <nav class="nav" role="navigation" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="about.html">About</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
          <a href="client-dashboard.html">Dashboard</a>
          <a href="admin-contacts.html" aria-current="page" style="color:#059669;font-weight:700">Admin</a>
        </nav>
        <div id="auth-ui" style="margin:0;white-space:nowrap">
          <button id="btn-signin" class="btn btn--sm btn--outline">Sign In</button>
        </div>
      </div>
    </header>

    <main>
      <div class="container admin-wrap">
        <div class="admin-header">
          <h1>Admin Dashboard</h1>
          <div class="admin-controls">
            <span class="status-badge" id="status-badge">
              <span class="status-dot"></span>
              <span id="status-text">Checking…</span>
            </span>
            <button class="btn btn--sm" id="refresh-btn">🔄 Refresh</button>
            <button class="btn btn--sm" id="test-btn">🧪 Test Backend</button>
          </div>
        </div>

        <div class="info-card">
          <strong>Backend Status:</strong><br>
          <small id="backend-info">Initializing…</small>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="contacts">📧 Contact Forms <span style="font-size:0.7rem;color:#51cf66">●</span></button>
          <button class="tab-btn" data-tab="orders">📦 Orders (Firebase)</button>
          <button class="tab-btn" data-tab="users">👥 Registered Users</button>
          <button class="tab-btn" data-tab="console">🖥️ Console</button>
        </div>

        <!-- Contacts Tab -->
        <div class="tab-content active" id="contacts">
          <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center">
            <input class="search-bar" id="search-input" placeholder="Search by name, email...">
            <span class="contact-count">Total: <span id="contact-count">0</span></span>
            <small style="color:#51cf66;font-weight:600">🔴 LIVE</small>
          </div>
          <div id="contacts-root" class="table-wrap"></div>
        </div>

        <!-- Orders Tab -->
        <div class="tab-content" id="orders">
          <div style="display:flex;gap:10px;margin-bottom:16px">
            <input class="search-bar" id="orders-search" placeholder="Search by name, email...">
            <span class="contact-count">Total: <span id="orders-count">0</span></span>
          </div>
          <div id="orders-root" class="table-wrap"></div>
        </div>

        <!-- Users Tab -->
        <div class="tab-content" id="users">
          <div style="display:flex;gap:10px;margin-bottom:16px">
            <input class="search-bar" id="users-search" placeholder="Search by name, email...">
            <span class="contact-count">Total: <span id="users-count">0</span></span>
          </div>
          <div id="users-root" class="table-wrap"></div>
        </div>

        <!-- Console Tab -->
        <div class="tab-content" id="console">
          <div class="console-panel" id="console-panel">Console logs will appear here…</div>
          <button class="btn btn--sm" id="clear-console" style="margin-top:12px">Clear Console</button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; Tea Shop Admin</p>
      </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDPHOcGwRxir9fMu4o4trpajK8p5a1s-C8",
        authDomain: "teashop-71af9.firebaseapp.com",
        projectId: "teashop-71af9",
        storageBucket: "teashop-71af9.firebasestorage.app",
        messagingSenderId: "480830622073",
        appId: "1:480830622073:web:13316536f8575a6fbd47a8",
        measurementId: "G-KCDVEW77SW"
      };
      firebase.initializeApp(firebaseConfig);
    </script>
    <script src="scripts/firebase.js"></script>

    <script>
    (function(){
      let allContacts = [];
      let allOrders = [];
      let allUsers = [];
      const consoleLogs = [];

      const CURRENCY = '₹';

      // Console logging helper
      function logToConsole(msg, type = 'log') {
        const timestamp = new Date().toLocaleTimeString();
        const line = `[${timestamp}] ${msg}`;
        consoleLogs.push({ msg: line, type });
        const panel = document.getElementById('console-panel');
        if (panel) {
          const pre = document.createElement('div');
          pre.className = `log ${type}`;
          pre.textContent = line;
          panel.appendChild(pre);
          panel.scrollTop = panel.scrollHeight;
        }
      }

      // Escape HTML
      function escapeHtml(s){ if(!s)return''; return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);}); }

      // Test Firestore connection
      async function testBackend() {
        logToConsole('Checking Firestore connection...', 'log');
        try {
          if (!window.TeaApp || !window.TeaApp.db) {
            throw new Error('Firestore not initialized');
          }
          
          const db = window.TeaApp.db;
          const snapshot = await db.collection('contacts').limit(1).get();
          logToConsole('✓ Firestore is connected and responding', 'success');
          updateStatusBadge('online', 'Firestore Online');
          updateBackendInfo(`✓ Database: Firestore | Status: Connected | Time: ${new Date().toLocaleTimeString()}`);
        } catch (err) {
          logToConsole(`✗ Firestore connection failed: ${err.message}`, 'error');
          updateStatusBadge('offline', 'Firestore Offline');
          updateBackendInfo(`⛔ Firestore error: ${err.message}`);
        }
      }

      function updateStatusBadge(status, text) {
        const badge = document.getElementById('status-badge');
        if (badge) {
          badge.className = `status-badge ${status}`;
          badge.innerHTML = `<span class="status-dot"></span><span id="status-text">${text}</span>`;
        }
      }

      function updateBackendInfo(msg) {
        const info = document.getElementById('backend-info');
        if (info) info.textContent = msg;
      }

      // Load contacts from Firestore with real-time updates
      let contactsUnsubscribe = null;
      
      async function loadContacts() {
        const root = document.getElementById('contacts-root');
        root.innerHTML = '<div class="state-msg"><span class="state-icon">⏳</span>Loading contacts…</div>';
        logToConsole('Setting up real-time listener for Firestore...', 'log');

        try {
          if (!window.TeaApp || !window.TeaApp.db) {
            throw new Error('Firestore not initialized');
          }

          const db = window.TeaApp.db;
          
          // Unsubscribe from previous listener if it exists
          if (contactsUnsubscribe) contactsUnsubscribe();
          
          // Set up real-time listener
          contactsUnsubscribe = db
            .collection('contacts')
            .orderBy('createdAt', 'desc')
            .limit(200)
            .onSnapshot(
              snapshot => {
                allContacts = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data(),
                  createdAt: doc.data().createdAt?.toDate?.().toISOString?.() || new Date().toISOString(),
                }));

                logToConsole(`✓ Real-time: Loaded ${allContacts.length} contacts`, 'success');
                filterAndRenderContacts();
                updateBackendInfo(`✓ Firestore live. Updated: ${new Date().toLocaleTimeString()}`);
                updateStatusBadge('online', 'Firestore Live');
              },
              err => {
                logToConsole(`✗ Real-time listener error: ${err.message}`, 'error');
                root.innerHTML = '<div class="state-msg error"><span class="state-icon">⚠️</span>Cannot load contacts.<br><small>Firestore listener failed. See console for details.</small></div>';
                updateBackendInfo(`❌ Listener error: ${err.message}`);
                updateStatusBadge('offline', 'Firestore Error');
              }
            );
        } catch (err) {
          logToConsole(`✗ Failed to setup listener: ${err.message}`, 'error');
          root.innerHTML = '<div class="state-msg error"><span class="state-icon">⚠️</span>Cannot load contacts.<br><small>Firestore initialization failed. See console for details.</small></div>';
          updateBackendInfo(`❌ Failed to setup listener: ${err.message}`);
          updateStatusBadge('offline', 'Firestore Error');
        }
      }

      function filterAndRenderContacts() {
        const query = (document.getElementById('search-input').value || '').trim().toLowerCase();
        const filtered = !query ? allContacts : allContacts.filter(c =>
          (c.name || '').toLowerCase().includes(query) ||
          (c.email || '').toLowerCase().includes(query) ||
          (c.message || '').toLowerCase().includes(query)
        );
        renderContactsTable(filtered);
      }

      function renderContactsTable(items) {
        const root = document.getElementById('contacts-root');
        document.getElementById('contact-count').textContent = items.length;

        if (items.length === 0) {
          root.innerHTML = '<div class="state-msg"><span class="state-icon">📭</span>No contacts found</div>';
          return;
        }

        let html = '<table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Message</th></tr></thead><tbody>';
        items.forEach(c => {
          const date = c.receivedAt ? new Date(c.receivedAt).toLocaleString() : '—';
          html += `<tr>
            <td><small>${escapeHtml(date)}</small></td>
            <td><strong>${escapeHtml(c.name || '')}</strong></td>
            <td><a href="mailto:${escapeHtml(c.email || '')}" style="color:var(--accent)">${escapeHtml(c.email || '')}</a></td>
            <td>${escapeHtml((c.message || '').substring(0, 80))}${(c.message || '').length > 80 ? '…' : ''}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        root.innerHTML = `<div class="table-wrap">${html}</div>`;
      }

      // Load orders from Firebase
      async function loadOrders() {
        const root = document.getElementById('orders-root');
        root.innerHTML = '<div class="state-msg"><span class="state-icon">⏳</span>Loading orders from Firebase…</div>';
        logToConsole('Fetching orders from Firebase...', 'log');

        try {
          const db = firebase.firestore();
          const snapshot = await db.collection('orders').orderBy('createdAt', 'desc').limit(100).get();
          allOrders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          logToConsole(`✓ Loaded ${allOrders.length} orders from Firebase`, 'success');
          filterAndRenderOrders();
        } catch (err) {
          logToConsole(`✗ Failed to load orders: ${err.message}`, 'error');
          root.innerHTML = '<div class="state-msg error"><span class="state-icon">⚠️</span>Cannot load orders.<br><small>Firebase error: ' + escapeHtml(err.message) + '</small></div>';
        }
      }

      function filterAndRenderOrders() {
        const query = (document.getElementById('orders-search').value || '').trim().toLowerCase();
        const filtered = !query ? allOrders : allOrders.filter(o =>
          (o.name || '').toLowerCase().includes(query) ||
          (o.email || '').toLowerCase().includes(query)
        );
        renderOrdersTable(filtered);
      }

      function renderOrdersTable(items) {
        const root = document.getElementById('orders-root');
        document.getElementById('orders-count').textContent = items.length;

        if (items.length === 0) {
          root.innerHTML = '<div class="state-msg"><span class="state-icon">📭</span>No orders found</div>';
          return;
        }

        let html = '<table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>';
        items.forEach(o => {
          const date = o.createdAt ? new Date(o.createdAt.toDate?.() || o.createdAt).toLocaleString() : '—';
          const itemCount = o.itemsDetail ? Object.keys(o.itemsDetail).length : 0;
          const total = CURRENCY + (o.total || 0).toFixed(2);
          const status = o.status || '—';
          html += `<tr>
            <td><small>${escapeHtml(date)}</small></td>
            <td><strong>${escapeHtml(o.name || '')}</strong></td>
            <td><a href="mailto:${escapeHtml(o.email || '')}" style="color:var(--accent)">${escapeHtml(o.email || '')}</a></td>
            <td>${itemCount} item${itemCount !== 1 ? 's' : ''}</td>
            <td><strong>${total}</strong></td>
            <td><span style="padding:4px 8px;background:rgba(43,138,74,0.2);border-radius:4px;color:var(--accent);font-size:0.85rem">${escapeHtml(status)}</span></td>
          </tr>`;
        });
        html += '</tbody></table>';
        root.innerHTML = `<div class="table-wrap">${html}</div>`;
      }

      // Load users from Firestore
      async function loadUsers() {
        const root = document.getElementById('users-root');
        root.innerHTML = '<div class="state-msg"><span class="state-icon">⏳</span>Loading registered users…</div>';
        logToConsole('Fetching registered users from Firebase...', 'log');

        try {
          const db = firebase.firestore();
          const snapshot = await db.collection('users').orderBy('createdAt', 'desc').limit(500).get();
          allUsers = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          logToConsole(`✓ Loaded ${allUsers.length} registered users from Firebase`, 'success');
          filterAndRenderUsers();
        } catch (err) {
          logToConsole(`✗ Failed to load users: ${err.message}`, 'error');
          root.innerHTML = '<div class="state-msg error"><span class="state-icon">⚠️</span>Cannot load users.<br><small>Firebase error: ' + escapeHtml(err.message) + '</small></div>';
        }
      }

      function filterAndRenderUsers() {
        const query = (document.getElementById('users-search').value || '').trim().toLowerCase();
        const filtered = !query ? allUsers : allUsers.filter(u =>
          (u.name || '').toLowerCase().includes(query) ||
          (u.email || '').toLowerCase().includes(query) ||
          (u.phone || '').toLowerCase().includes(query)
        );
        renderUsersTable(filtered);
      }

      function renderUsersTable(items) {
        const root = document.getElementById('users-root');
        document.getElementById('users-count').textContent = items.length;

        if (items.length === 0) {
          root.innerHTML = '<div class="state-msg"><span class="state-icon">👤</span>No registered users found</div>';
          return;
        }

        let html = '<table><thead><tr><th>Date Joined</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th></tr></thead><tbody>';
        items.forEach(u => {
          const date = u.createdAt ? new Date(u.createdAt.toDate?.() || u.createdAt).toLocaleString() : '—';
          html += `<tr>
            <td><small>${escapeHtml(date)}</small></td>
            <td><strong>${escapeHtml(u.name || '—')}</strong></td>
            <td><a href="mailto:${escapeHtml(u.email || '')}" style="color:var(--accent)">${escapeHtml(u.email || '—')}</a></td>
            <td><small>${escapeHtml(u.phone || '—')}</small></td>
            <td><small>${escapeHtml((u.address || '—').substring(0, 50))}</small></td>
          </tr>`;
        });
        html += '</tbody></table>';
        root.innerHTML = `<div class="table-wrap">${html}</div>`;
      }

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.dataset.tab;
          document.getElementById(tab).classList.add('active');
          if (tab === 'orders') loadOrders();
          if (tab === 'users') loadUsers();
          if (tab === 'console') logToConsole('Console tab opened', 'log');
        });
      });

      // Event listeners
      document.getElementById('refresh-btn').addEventListener('click', () => {
        logToConsole('Refreshing all data...', 'log');
        loadContacts();
        if (document.querySelector('.tab-btn.active').dataset.tab === 'orders') loadOrders();
      });

      document.getElementById('test-btn').addEventListener('click', testBackend);
      document.getElementById('search-input').addEventListener('input', filterAndRenderContacts);
      document.getElementById('orders-search').addEventListener('input', filterAndRenderOrders);
      document.getElementById('users-search').addEventListener('input', filterAndRenderUsers);
      document.getElementById('clear-console').addEventListener('click', () => {
        document.getElementById('console-panel').innerHTML = '<div class="log">Console cleared</div>';
        logToConsole('Console cleared by user', 'log');
      });

      // Initial load
      document.addEventListener('DOMContentLoaded', () => {
        logToConsole('Admin dashboard initialized', 'log');
        testBackend();
        setTimeout(loadContacts, 500);
      });
    })();
    </script>
  </body>
</html>
